steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/memepix:latest'
      - '.'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/memepix:latest'
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'memepix'
      - '--image'
      - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,R2_ENDPOINT=https://your-account-id.r2.cloudflarestorage.com,R2_BUCKET_NAME=memepix-images'
      - '--set-secrets'
      - 'GOOGLE_AI_API_KEY=google-ai-api-key:latest,R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,R2_PUBLIC_URL=r2-public-url:latest,NEXTAUTH_SECRET=nextauth-secret:latest,GITHUB_CLIENT_ID=github-client-id:latest,GITHUB_CLIENT_SECRET=github-client-secret:latest'

images:
  - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/memepix:latest'

options:
  logging: CLOUD_LOGGING_ONLY
