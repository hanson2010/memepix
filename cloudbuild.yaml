steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/memepix:latest'
      - '.'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/memepix:latest'
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'memepix'
      - '--image'
      - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NEXTAUTH_URL=https://memepix-XXXXX-nw.a.run.app'
      # All sensitive values live in one JSON secret; see src/lib/env.ts
      - '--set-secrets'
      - 'APP_SECRETS=memepix-secrets:latest'

images:
  - 'gcr.io/$PROJECT_ID/memepix:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/memepix:latest'

options:
  logging: CLOUD_LOGGING_ONLY
